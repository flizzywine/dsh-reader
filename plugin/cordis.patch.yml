# dsh-reader bundle patch: one Host+Client plugin row.
# The browser half is discovered through the package.json dsh.client declaration.
- insert:
    - id: dsh-reader
      name: 'dsh-reader'
# Reading sessions live apart from the user's other DSH profiles.
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('profile-data', 'reader', 'sessions')
- id: storage-json
  config:
    root: !!js dshHomePath('profile-data', 'reader', 'storages')
# dsh-pocket (phone access) proxies this profile on its own port; tavern's pocket keeps 3081.
- id: dsh-pocket
  config:
    port: !!js Number(process.env.DSH_READER_POCKET_PORT || 30161)
